server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gates the whole dashboard (UI + /api/ proxy) behind HTTP Basic Auth.
    # .htpasswd is supplied at runtime via a Secret volume mount (see
    # k8s/dashboard/frontend-deployment.yaml) -- never baked into the image
    # or committed. See docs/RUNBOOKS.md for how to rotate the password.
    auth_basic "Homelab Dashboard";
    auth_basic_user_file /etc/nginx/secrets/.htpasswd;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://dashboard-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://dashboard-backend:8000/health;
    }
}
