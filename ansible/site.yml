---
- name: Ensure CIFS UTF-8 kernel module support across the cluster
  hosts: k3s_cluster
  become: true
  roles:
    - kernel-modules

- name: Apply CIS Benchmark file permission fixes (kube-bench findings)
  hosts: k3s_cluster
  become: true
  roles:
    - k3s-file-permissions

- name: Deploy automatic node-boot Ansible watcher on control-plane
  hosts: pi4-master
  become: true
  roles:
    - node-boot-watcher
