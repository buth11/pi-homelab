---
- name: Ensure CIFS UTF-8 kernel module support across the cluster
  hosts: k3s_cluster
  become: true
  roles:
    - kernel-modules

- name: Apply CIS Benchmark file permission fixes (kube-bench findings)
  hosts: k3s_cluster
  become: true
  roles:
    - k3s-file-permissions

- name: Deploy automatic node-boot Ansible watcher on control-plane
  hosts: pi4-master
  become: true
  roles:
    - node-boot-watcher

- name: Install smartmontools on nodes with physical SMART-capable disks
  # Pis boot from SD cards (no SMART), k3s-burst-worker has a virtual disk
  # (its physical disks belong to Proxmox).
  hosts: g3-worker3
  become: true
  tags: [smartmontools]
  roles:
    - smartmontools
