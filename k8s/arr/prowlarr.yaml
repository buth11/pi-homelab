apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: arr
spec:
  replicas: 1
  selector: { matchLabels: { app: prowlarr } }
  template:
    metadata: { labels: { app: prowlarr } }
    spec:
      nodeSelector:
        kubernetes.io/hostname: g3-worker3
      containers:
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:latest
        env:
        - { name: PUID, value: "1000" }
        - { name: PGID, value: "1000" }
        - { name: TZ, value: "Europe/Warsaw" }
        ports: [{ containerPort: 9696, name: webui }]
        volumeMounts:
        - { name: config, mountPath: /config }
      volumes:
      - name: config
        persistentVolumeClaim: { claimName: prowlarr-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: arr
spec:
  type: LoadBalancer
  selector: { app: prowlarr }
  ports: [{ port: 9696, targetPort: 9696 }]
