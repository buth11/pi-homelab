apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: arr
spec:
  replicas: 1
  selector: { matchLabels: { app: sonarr } }
  template:
    metadata: { labels: { app: sonarr } }
    spec:
      nodeSelector:
        kubernetes.io/hostname: g3-worker3
      containers:
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:latest
        env:
        - { name: PUID, value: "1000" }
        - { name: PGID, value: "1000" }
        - { name: TZ, value: "Europe/Warsaw" }
        ports: [{ containerPort: 8989, name: webui }]
        volumeMounts:
        - { name: config, mountPath: /config }
        - { name: downloads, mountPath: /downloads }
        - { name: media, mountPath: /media }
      volumes:
      - name: config
        persistentVolumeClaim: { claimName: sonarr-config }
      - name: downloads
        persistentVolumeClaim: { claimName: arr-downloads }
      - name: media
        persistentVolumeClaim: { claimName: arr-media }
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: arr
spec:
  type: LoadBalancer
  selector: { app: sonarr }
  ports: [{ port: 8989, targetPort: 8989 }]
