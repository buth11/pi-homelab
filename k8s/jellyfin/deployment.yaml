apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        supplementalGroups:
        - 44
        - 109
      containers:
      - name: jellyfin
        # Pinned 2026-11-25: :latest + pull Always silently upgraded 10.x -> 12.4.0
        # on the 2026-10-29 cold start and broke the Tizen TV client login.
        # Upgrade deliberately: bump tag+digest here, check client compatibility.
        image: jellyfin/jellyfin:12.4.0@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
        imagePullPolicy: IfNotPresent
        env:
        - name: JELLYFIN_PublishedServerUrl
          value: "http://192.168.50.56"
        ports:
        - containerPort: 8096
          name: webui
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
        - name: dri
          mountPath: /dev/dri
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: jellyfin-config
      - name: media
        persistentVolumeClaim:
          claimName: jellyfin-media-v2
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      nodeSelector:
        kubernetes.io/hostname: g3-worker3
