apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: smb-tank-bulk-media
provisioner: smb.csi.k8s.io
parameters:
  source: "//192.168.50.21/media"
  csi.storage.k8s.io/node-stage-secret-name: smb-tank-fast-secret
  csi.storage.k8s.io/node-stage-secret-namespace: kube-system
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - uid=1000
  - gid=1000
  - vers=2.0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media-v2
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: smb-tank-bulk-media
  resources:
    requests:
      storage: 900Gi
