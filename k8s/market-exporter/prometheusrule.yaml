apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: market-exporter
  namespace: market
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: market.recording
      rules:
      - record: market:asset_price:max
        expr: max without (pod, instance) (asset_price)
    - name: market.levels
      rules:
      - alert: MarketLevelCrossedUp
        expr: |
          max without (pod, instance) (asset_last_crossed_level)
            and on (asset, quote, source)
          (sum without (pod, instance) (increase(asset_level_crossings_total{direction="up"}[5m])) > 0)
        labels:
          severity: notice
          category: market
          level: '{{ $value }}'
        annotations:
          summary: '{{ $labels.asset }}/{{ $labels.quote }} przebił {{ if eq $labels.quote "PLN" }}{{ printf "%.2f" $value }}{{ else }}{{ printf "%.0f" $value }}{{ end }} w górę'
      - alert: MarketLevelCrossedDown
        expr: |
          max without (pod, instance) (asset_last_crossed_level)
            and on (asset, quote, source)
          (sum without (pod, instance) (increase(asset_level_crossings_total{direction="down"}[5m])) > 0)
        labels:
          severity: notice
          category: market
          level: '{{ $value }}'
        annotations:
          summary: '{{ $labels.asset }}/{{ $labels.quote }} przebił {{ if eq $labels.quote "PLN" }}{{ printf "%.2f" $value }}{{ else }}{{ printf "%.0f" $value }}{{ end }} w dół'
