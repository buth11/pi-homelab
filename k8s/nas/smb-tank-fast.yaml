apiVersion: v1
kind: Secret
metadata:
  name: smb-tank-fast-secret
  namespace: kube-system
type: Opaque
stringData:
  username: SMB_TANK_LOGIN_PLACEHOLDER
  password: SMB_TANK_PASSWORD_PLACEHOLDER
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: smb-tank-fast
provisioner: smb.csi.k8s.io
parameters:
  source: "//192.168.50.21/k3s-pv"
  csi.storage.k8s.io/node-stage-secret-name: smb-tank-fast-secret
  csi.storage.k8s.io/node-stage-secret-namespace: kube-system
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - dir_mode=0777
  - file_mode=0777
