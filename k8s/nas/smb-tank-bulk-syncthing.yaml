apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: smb-tank-bulk-syncthing
mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - uid=1000
  - gid=1000
  - vers=3.0
  - iocharset=utf8
parameters:
  csi.storage.k8s.io/node-stage-secret-name: smb-tank-fast-secret
  csi.storage.k8s.io/node-stage-secret-namespace: kube-system
  source: //192.168.50.21/syncthing
provisioner: smb.csi.k8s.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
