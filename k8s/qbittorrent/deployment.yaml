apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
  labels:
    app: qbittorrent
spec:
  replicas: 1
  # Recreate, never two pods at once: two Gluetuns with the same Proton key
  # would fight over the tunnel, and two qBittorrents would race on the
  # same config (see postmortems/2026-07-25-qbittorrent-config-race-and-port-drift.md).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # ---------------------------------------------------------------------
      # VPN kill switch (2026-11-27, see docs/postmortems/2026-11-27-qbittorrent-vpn-leak.md)
      #
      # Every packet of qBittorrent AND Firefox (same pod = same network
      # namespace) must leave through ProtonVPN, never the home IP.
      # - gluetun is a native sidecar (initContainer + restartPolicy: Always)
      #   with a startupProbe: the app containers only start once the tunnel
      #   is up and healthy, so there is no window without VPN.
      # - gluetun's firewall drops all outbound traffic that is not inside
      #   the tunnel (FIREWALL_OUTBOUND_SUBNETS deliberately unset). If the
      #   tunnel dies, traffic stops; it does not fall back to the LAN uplink.
      # - Inbound only for the WebUI (8080) and noVNC (3000/3001) from LAN.
      # - DNS goes to gluetun's resolver (DNS over TLS through the tunnel),
      #   not CoreDNS, so tracker lookups do not leak to the ISP either.
      # - qBittorrent is also bound to tun0 in its own settings (defence in
      #   depth: without the firewall it still cannot use eth0).
      # Do NOT go back to the host-level wg-quick on g3: systemd-networkd
      # silently drops its routing rules on every restart (unattended-upgrades),
      # which is exactly how traffic leaked from 2026-07-29 and 2026-11-04.
      # ---------------------------------------------------------------------
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 127.0.0.1
      initContainers:
      - name: gluetun
        image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
        restartPolicy: Always
        # The pod network namespace outlives a gluetun container restart, and
        # so do the ip rules of the previous run. A new gluetun then fails with
        # "adding ip rule 101 ... table 51820: file exists" and never reconnects
        # (seen 2026-11-27). Delete leftovers before starting. (The gluetun wiki
        # suggests postStart for this, but postStart runs concurrently with the
        # container and could race gluetun's own rule setup.)
        command:
        - /bin/sh
        - -c
        - |
          while ip rule del table 51820 2>/dev/null; do :; done
          while ip -6 rule del table 51820 2>/dev/null; do :; done
          exec /gluetun-entrypoint
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        env:
        # Built-in ProtonVPN provider: gluetun picks a server from its
        # server list (and another one if it fails). The WireGuard key is
        # per Proton account, not per server.
        - name: VPN_SERVICE_PROVIDER
          value: "protonvpn"
        - name: VPN_TYPE
          value: "wireguard"
        - name: WIREGUARD_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: protonvpn-wireguard
              key: private-key
        - name: WIREGUARD_ADDRESSES
          value: "10.2.0.2/32"
        - name: SERVER_COUNTRIES
          value: "Switzerland"
        # Only servers with port forwarding = Proton's P2P servers (torrenting
        # is only allowed on P2P servers).
        - name: PORT_FORWARD_ONLY
          value: "on"
        # Proton NAT-PMP port forwarding (incoming peers). Proton assigns the
        # port and it changes on every reconnect; gluetun then runs
        # /scripts/qbt-port.sh (ConfigMap qbt-port-forward), which logs in to
        # the qBittorrent API with Secret qbittorrent-webui and sets it as the
        # listen port. A rejected login is not retried (qBittorrent bans
        # 127.0.0.1 after 5 failures).
        - name: VPN_PORT_FORWARDING
          value: "on"
        - name: VPN_PORT_FORWARDING_UP_COMMAND
          value: "/bin/sh /scripts/qbt-port.sh {{PORTS}}"
        - name: QBT_USER
          valueFrom:
            secretKeyRef:
              name: qbittorrent-webui
              key: username
        - name: QBT_PASS
          valueFrom:
            secretKeyRef:
              name: qbittorrent-webui
              key: password
        # 8080 WebUI, 3000/3001 noVNC, 9101 vpn-guard metrics (Prometheus)
        - name: FIREWALL_INPUT_PORTS
          value: "8080,3000,3001,9101"
        - name: BLOCK_MALICIOUS
          value: "off"
        - name: TZ
          value: "Europe/Warsaw"
        - name: GOMEMLIMIT
          value: "700MiB"
        startupProbe:
          exec:
            command: ["/gluetun-entrypoint", "healthcheck"]
          periodSeconds: 5
          failureThreshold: 60
        # No livenessProbe on purpose: gluetun restarts the tunnel itself when
        # its healthcheck fails (HEALTH_RESTART_VPN). A kubelet kill on top of
        # that triggered the stale-ip-rule loop above. VpnDown alert covers
        # a tunnel that really stays down.
        volumeMounts:
        - name: qbt-port-forward
          mountPath: /scripts
          readOnly: true
        # With the built-in protonvpn provider gluetun keeps its ~21k-server
        # list in memory: steady state ~360 MiB anon (measured via cgroup
        # memory.stat; the Prometheus working-set graph showed much less), with
        # spikes when the tunnel restarts and the list is parsed again. The old
        # 256Mi limit OOM-killed it in a loop (24 kills on 2026-11-27).
        # GOMEMLIMIT (env above) makes the Go GC work before the hard limit.
        resources:
          requests:
            memory: 384Mi
          limits:
            memory: 1Gi
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 256Mi
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Europe/Warsaw"
        - name: WEBUI_PORT
          value: "8080"
        ports:
        - containerPort: 8080
          name: webui
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads

      - name: firefox
        image: lscr.io/linuxserver/firefox:latest
        resources:
          requests:
            memory: 2560Mi
          limits:
            memory: 3Gi
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Europe/Warsaw"
        ports:
        - containerPort: 3000
          name: firefox-http
        - containerPort: 3001
          name: firefox-https
        volumeMounts:
        - name: firefox-config
          mountPath: /config
        - name: downloads
          mountPath: /downloads

      # Checks every 5 min which network the pod really egresses from and
      # exposes it to Prometheus (alerts: vpn-guard-monitoring.yaml). Same pod
      # = same path as qBittorrent and Firefox, so a leak shows up here.
      - name: vpn-guard
        image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
        command: ["python3", "-I", "/app/vpn-guard.py"]
        env:
        # Home ISP (Orange Polska). Egress from this ASN = VPN leak.
        - name: HOME_ASNS
          value: "AS5617"
        - name: INTERVAL
          value: "300"
        ports:
        - containerPort: 9101
          name: vpn-guard
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: 48Mi
        volumeMounts:
        - name: vpn-guard
          mountPath: /app
          readOnly: true

      volumes:
      - name: qbt-port-forward
        configMap:
          name: qbt-port-forward
      - name: vpn-guard
        configMap:
          name: vpn-guard
      - name: config
        persistentVolumeClaim:
          claimName: qbittorrent-config-local
      - name: downloads
        persistentVolumeClaim:
          claimName: qbittorrent-downloads-tank-bulk
      - name: firefox-config
        persistentVolumeClaim:
          claimName: qbittorrent-firefox-config

      nodeSelector:
        kubernetes.io/hostname: g3-worker3
