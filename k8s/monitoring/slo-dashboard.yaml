# Grafana dashboard "SLO: Vaultwarden and DNS" (uid: slo-vaultwarden-dns),
# provisioned as a ConfigMap picked up by the Grafana sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-slo-vaultwarden-dns
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  slo-vaultwarden-dns.json: |
    {
      "uid": "slo-vaultwarden-dns",
      "title": "SLO: Vaultwarden and DNS",
      "description": "Availability against SLO targets, error budget burn and probe history for Vaultwarden and Pi-hole DNS.",
      "tags": [
        "homelab",
        "slo"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "title": "Vaultwarden availability, 30d (SLO 99.5%)",
          "description": "Share of successful probes over 30 days.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "vaultwarden:availability:30d",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.995
                  },
                  {
                    "color": "green",
                    "value": 0.9955
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false,
              "fields": ""
            },
            "colorMode": "background",
            "graphMode": "area"
          }
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Internal DNS availability, 30d (SLO 99.9%)",
          "description": "Share of successful internal DNS probes over 30 days (vault.home.local resolves to Traefik).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "pihole:availability:30d",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.999
                  },
                  {
                    "color": "green",
                    "value": 0.9995
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false,
              "fields": ""
            },
            "colorMode": "background",
            "graphMode": "area"
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "Vaultwarden certificate: days left",
          "description": "Days until the Let's Encrypt certificate expires (manual renewal).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(probe_ssl_earliest_cert_expiry{job=\"vaultwarden\"} - time()) / 86400",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 21
                  },
                  {
                    "color": "green",
                    "value": 45
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false,
              "fields": ""
            },
            "colorMode": "background",
            "graphMode": "area"
          }
        },
        {
          "type": "timeseries",
          "id": 4,
          "title": "Error budget burn: Vaultwarden",
          "description": "Error ratio over 1h and 5m. Fast burn above 0.072 pages, slow burn above 0.03 opens a ticket.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "vaultwarden:error_ratio:1h",
              "legendFormat": "1h",
              "refId": "A",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "vaultwarden:error_ratio:5m",
              "legendFormat": "5m",
              "refId": "B",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 5,
          "title": "Error budget burn: internal DNS",
          "description": "Error ratio over 1h and 5m. Fast burn above 0.0144 pages, slow burn above 0.006 opens a ticket.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "pihole:error_ratio:1h",
              "legendFormat": "1h",
              "refId": "A",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "pihole:error_ratio:5m",
              "legendFormat": "5m",
              "refId": "B",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 6,
          "title": "Probe history",
          "description": "1 = success, 0 = failure. Gaps mean the probe did not run.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "probe_success{job=\"vaultwarden\"}",
              "legendFormat": "vaultwarden",
              "refId": "A",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "probe_success{job=\"pihole-dns-internal\"}",
              "legendFormat": "dns internal",
              "refId": "B",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "probe_success{job=\"pihole-dns-upstream\"}",
              "legendFormat": "dns upstream",
              "refId": "C",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bool",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ]
    }
