apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-nginx-conf
  namespace: dashboard
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Gates the whole dashboard (UI + /api/ proxy) behind HTTP Basic Auth.
        # .htpasswd comes from the dashboard-auth Secret (see auth-secret.yaml)
        # -- never baked into the image or committed here.
        auth_basic "Homelab Dashboard";
        auth_basic_user_file /etc/nginx/secrets/.htpasswd;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://dashboard-backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass http://dashboard-backend:8000/health;
        }
    }
