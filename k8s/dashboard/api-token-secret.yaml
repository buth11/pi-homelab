# Placeholder only -- never apply this file as-is.
#
# Shared token between the nginx frontend and the backend. nginx adds it as
# X-Dashboard-Token to every /api/ request, and the backend rejects anything
# without it. Needed because the backend uses hostNetwork and so listens
# on the node's LAN IP, where nginx's Basic Auth does not apply.
#
# Generate and apply the real Secret on the live cluster (never commit it):
#
#   TOKEN=$(openssl rand -hex 32)
#   kubectl create secret generic dashboard-api-token -n dashboard \
#     --from-literal=token="$TOKEN" \
#     --from-literal=proxy-header.conf="proxy_set_header X-Dashboard-Token \"$TOKEN\";" \
#     --dry-run=client -o yaml | kubectl apply -f -
#   unset TOKEN
#
# Rotate: repeat the above, then restart BOTH deployments (frontend first):
#   kubectl rollout restart deployment/dashboard-frontend -n dashboard
#   kubectl rollout restart deployment/dashboard-backend -n dashboard
#
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-api-token
  namespace: dashboard
type: Opaque
stringData:
  token: DASHBOARD_API_TOKEN_PLACEHOLDER
  proxy-header.conf: DASHBOARD_API_TOKEN_PLACEHOLDER
