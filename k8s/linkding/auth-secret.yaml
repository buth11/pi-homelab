# Placeholder only -- never apply this file as-is.
#
# Generate and apply the real Secret on the live cluster:
#
#   PASS=$(openssl rand -base64 18 | tr -d '/+=' | head -c 24)
#   echo "$PASS"   # save it (e.g. Vaultwarden) -- shown once
#   kubectl create secret generic linkding-auth -n linkding \
#     --from-literal=superuser-name=buth11 \
#     --from-literal=superuser-password="$PASS" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# To rotate the password later, repeat the same command (kubectl apply
# overwrites the existing Secret) and restart the deployment so Linkding
# re-reads it:
#
#   kubectl rollout restart deployment/linkding -n linkding
#
apiVersion: v1
kind: Secret
metadata:
  name: linkding-auth
  namespace: linkding
type: Opaque
stringData:
  superuser-name: LINKDING_SUPERUSER_NAME_PLACEHOLDER
  superuser-password: LINKDING_SUPERUSER_PASSWORD_PLACEHOLDER
