image:
  tag: "2.19.1"
singleNode: true
replicas: 1
resources:
  requests:
    memory: 1500Mi
    cpu: 250m
  limits:
    memory: 2Gi
opensearchJavaOpts: "-Xms512m -Xmx512m"
persistence:
  enabled: true
  storageClass: local-path
  size: 8Gi
plugins:
  securityConfig:
    enabled: false
config:
  opensearch.yml: |
    plugins.security.disabled: true
nodeSelector:
  kubernetes.io/hostname: g3-worker3
