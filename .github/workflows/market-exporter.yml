name: Market Exporter CI/CD
on:
  push:
    branches: [main]
    paths:
      - 'market-exporter/**'
      - '.github/workflows/market-exporter.yml'
  pull_request:
    paths:
      - 'market-exporter/**'
      - '.github/workflows/market-exporter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: market-exporter
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            - name: pip install
              run: pip install -r requirements.txt -r requirements-dev.txt
            - name: pytest
              run: pytest -q
    build:
        name: Build image
        needs: test
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        steps:
          - uses: actions/checkout@v4
          - uses: docker/setup-qemu-action@v3
          - uses: docker/setup-buildx-action@v3
          - uses: docker/login-action@v3
            if: github.event_name != 'pull_request'
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
          - uses: docker/build-push-action@v6
            with:
              context: ./market-exporter
              platforms: linux/amd64,linux/arm64
              push: ${{ github.event_name != 'pull_request' }}
              tags: ghcr.io/${{ github.repository_owner }}/pi-homelab/market-exporter:${{ github.sha }}
              cache-from: type=gha
              cache-to: type=gha,mode=max  