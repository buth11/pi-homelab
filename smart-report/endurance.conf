# Manufacturer ratings per model. Used for wear (% of rating), "TBW left"
# and remaining-life projections. Format:
#   model substring as smartctl reports it | VALUE
# where VALUE is a bare number (= TBW, terabytes written, for SSD/NVMe) or
# key=value pairs:
#   tbw=N          SSD/NVMe rated endurance, TB written
#   load_cycles=N  HDD rated load/unload cycles
#   workload=N     HDD rated workload, TB/year (reads + writes)
# Longest matching substring wins. Leave a model out when its rating is
# unknown: wear then comes from the drive's own "% used" counter.
# Ratings are warranty figures (conservative), not the point of failure.

# --- SSD / NVMe ------------------------------------------------------------
Lexar SSD NM620 256GB       | 125    # Lexar product sheet; TechPowerUp
SanDisk X400 M.2 2280 256GB | 80     # SanDisk X400 datasheet v1.0/1.1 (JESD219)
Micron 2200 NVMe 256GB      | 75     # Micron 2200 product brief
KINGSTON SKC600512G         | 300    # Kingston KC600 datasheet
Samsung SSD 870 EVO 500GB   | 300    # Samsung 870 EVO warranty table
WDC WDS250G2B0A             | 100    # WD Blue 3D SATA 250GB (WD spec table)
CT2000BX500SSD1             | 720    # Crucial BX500 2TB (not confirmed in an official sheet)
WD Blue SN570 1TB           | 600    # WD Blue SN570 (Tom's Hardware, AnandTech)
WD Red SN700 500GB          | 1000   # WD Red SN700 (Tom's Hardware)
# SK hynix SC311 SATA 256GB: no published rating found (512GB = 300 TBW)
# M.2 SSD 512GB (g3-worker3 sda): no-name drive, no rating

# --- HDD -------------------------------------------------------------------
WDC WD100EFAX               | load_cycles=600000 workload=180   # WD Red 10TB datasheet
