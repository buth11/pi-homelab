alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: ['namespace']
      - target_matchers: ['alertname = InfoInhibitor']
    receivers:
      - name: "null"
      - name: "ntfy"
        webhook_configs:
          - url: "REPLACE_ME?template=alertmanager"
            send_resolved: true
            http_config:
              follow_redirects: true
      - name: "deadman"
        webhook_configs:
          - url: "REPLACE_ME"
            send_resolved: false
    route:
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
      routes:
        - matchers: ['alertname = "Watchdog"']
          receiver: "deadman"
          repeat_interval: 5m
        - matchers: ['severity = "critical"']
          receiver: "ntfy"
          repeat_interval: 4h
        - matchers: ['severity = "warning"']
          receiver: "ntfy"
    templates:
      - '/etc/alertmanager/config/*.tmpl'

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  adminPassword: ""
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes: ["ReadWriteOnce"]
    size: 2Gi
  service:
    type: LoadBalancer

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 8Gi
    additionalScrapeConfigs:
      - job_name: truenas-storage
        scrape_interval: 30s
        static_configs:
          - targets: ["192.168.50.21:9100"]
            labels:
              host: truenas
